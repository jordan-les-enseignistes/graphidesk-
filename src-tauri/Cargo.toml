[package]
name = "graphidesk"
version = "1.7.0"
description = "Application de suivi des dossiers graphistes - Les Enseignistes"
authors = ["Les Enseignistes"]
license = "UNLICENSED"
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "graphidesk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1.0"
base64 = "0.22"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
# dépliage des squelettes de dossier (le zip sait stocker les dossiers VIDES,
# ce qu'aucun format plat ne permet)
zip = { version = "4", default-features = false, features = ["deflate"] }
# "devtools" : F12 disponible aussi en build de production (outil interne Ã¢â‚¬â€
# indispensable pour diagnostiquer les comportements spÃƒÂ©cifiques ÃƒÂ  la prod)
tauri = { version = "2", features = ["tray-icon", "devtools"] }
tauri-plugin-shell = "2"
tauri-plugin-process = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2.9.0"
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
